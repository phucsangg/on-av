name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Typecheck, Lint, Validate & Build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate question datasets
        run: npm run validate:data

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Lint check
        run: npm run lint

      - name: Production build
        run: npm run build
